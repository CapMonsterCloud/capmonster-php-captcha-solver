name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
      - run: composer validate --strict
      - uses: ramsey/composer-install@v3
      - name: Lint
        run: find src tests examples -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      # Unit tests + client tests against a fake transport: no network or API key needed.
      - run: vendor/bin/phpunit

  release-readiness:
    name: version + changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CHANGELOG.md has an entry for CapMonsterClient::VERSION
        run: |
          VERSION=$(sed -nE "s/.*const VERSION = '([^']+)'.*/\1/p" src/CapMonsterClient.php)
          echo "version: $VERSION"
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "CHANGELOG.md has no '## [$VERSION]' section"; exit 1; }
